# MySQL database configuration, you no need to touch this unless you enabled MySQL support.
# To enable MySQL support go to > config.yml and set 'DatabaseEnabled' to true

# Replace <databasename> with your database
address: jdbc:mysql://localhost:3306/<databasename>?useSSL=false

# MySQL user name
user: <user>

# MySQL user password
password: <password>
# Don't edit it. But who's stopping you? It's your server!
# Really, don't edit ;p
# You edited it, huh? Next time hurt yourself!
Do-Not-Edit:
  File-Version: 1
  Core-Version: 0
